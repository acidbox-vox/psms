<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ · ระบบจำหน่ายบุคลากร</title>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet"></noscript>
<script src="js/api-config.js"></script>
<script src="js/cache.js"></script>
<script src="js/loader.js"></script>
<style>
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --border: #e2e8f0;
  --border-hover: #c7d4e8;
  --text: #1a2340;
  --text2: #5a6a8a;
  --text3: #9aaac0;
  --blue: #3b7cf4;
  --blue-light: rgba(59,124,244,0.08);
  --green: #10b981;
  --red: #ef4444;
  --red-light: rgba(239,68,68,0.08);
  --shadow: 0 2px 12px rgba(26,35,64,0.07);
  --shadow-hover: 0 8px 32px rgba(26,35,64,0.13);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body {
  font-family: 'Sarabun', sans-serif;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px 16px;
  position: relative; overflow-x: hidden;
}
body::before {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image: radial-gradient(circle, rgba(59,124,244,0.07) 1px, transparent 1px);
  background-size: 28px 28px;
}
body::after {
  content:''; position:fixed; top:0; left:0; right:0; height:3px; z-index:10;
  background: linear-gradient(90deg, #3b7cf4, #7c3aed, #0d9488);
}

.wrap {
  width:100%; max-width:400px;
  position:relative; z-index:1;
}

/* Brand */
.brand {
  text-align:center; margin-bottom:36px;
  animation: slideDown .6s cubic-bezier(.22,.68,0,1.2) both;
}
@keyframes slideDown { from{opacity:0;transform:translateY(-18px)} to{opacity:1;transform:none} }

.brand-ring {
  width:76px; height:76px; border-radius:22px; margin:0 auto 16px;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface); border:1.5px solid var(--border);
  box-shadow: var(--shadow), 0 0 0 6px rgba(59,124,244,0.06);
}
.brand-img { width:46px; height:46px; object-fit:contain; }
.brand h1 { font-size:1.7em; font-weight:800; color:var(--text); letter-spacing:-0.025em; }
.brand-sub { font-size:0.84em; color:var(--text2); margin-top:6px; line-height:1.6; }
.brand-pill {
  display:inline-flex; align-items:center; gap:5px;
  margin-top:10px; padding:5px 14px; border-radius:20px;
  background:var(--blue-light); border:1px solid rgba(59,124,244,0.2);
  font-size:0.72em; font-weight:700; color:var(--blue); letter-spacing:.05em;
}

/* Card */
.card {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:22px; padding:32px 28px;
  box-shadow: var(--shadow);
  animation: cardIn .5s ease .15s both;
}
@keyframes cardIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }

.card-title {
  font-size:1em; font-weight:700; color:var(--text); margin-bottom:6px;
  display:flex; align-items:center; gap:8px;
}
.card-title span { font-size:1.2em; }
.card-desc { font-size:0.82em; color:var(--text2); margin-bottom:24px; line-height:1.5; }

/* Form fields */
.field { margin-bottom:16px; }
.field label { display:block; font-size:0.78em; font-weight:700; color:var(--text2); margin-bottom:6px; }
.input-wrap { position:relative; }
.input-wrap input {
  width:100%; padding:14px 16px; border-radius:14px;
  border:2px solid var(--border); background:var(--bg);
  font-family:'Sarabun',sans-serif; font-size:1em; color:var(--text);
  outline:none; caret-color:var(--blue);
  transition: border-color .2s, box-shadow .2s;
}
.input-wrap input:focus {
  border-color:var(--blue); background:var(--surface);
  box-shadow:0 0 0 3px rgba(59,124,244,0.15);
}
.input-wrap input.error {
  border-color:var(--red) !important;
  box-shadow:0 0 0 3px rgba(239,68,68,0.15) !important;
  animation: shake .35s ease;
}
.input-wrap input.success {
  border-color:var(--green) !important;
  box-shadow:0 0 0 3px rgba(16,185,129,0.15) !important;
}
.input-wrap.has-eye input { padding-right:50px; }
.eye-btn {
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer;
  font-size:1.1em; padding:8px 10px; line-height:1; opacity:.7;
}
.eye-btn:hover { opacity:1; }
@keyframes shake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}

/* Error msg */
.error-msg {
  background: var(--red-light); border:1px solid rgba(239,68,68,0.25);
  border-radius:12px; padding:12px 16px;
  font-size:0.82em; color:var(--red); font-weight:600;
  text-align:center; line-height:1.5;
  margin-bottom:16px;
  display:none;
  animation: fadeInUp .3s ease both;
}
@keyframes fadeInUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.error-msg.show { display:block; }

/* Submit btn */
.btn-login {
  width:100%; padding:15px;
  background: linear-gradient(135deg, var(--blue), #5b5cf6);
  color:#fff; border:none; border-radius:14px;
  font-family:'Sarabun',sans-serif; font-size:1em; font-weight:700;
  cursor:pointer; letter-spacing:.03em;
  box-shadow: 0 4px 16px rgba(59,124,244,0.35);
  transition: all .2s ease;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-login:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(59,124,244,0.45);
}
.btn-login:active:not(:disabled) { transform: scale(.97); }
.btn-login:disabled { opacity:.6; cursor:not-allowed; transform:none; }

/* Loading spinner */
.spinner {
  width:18px; height:18px; border:2.5px solid rgba(255,255,255,0.3);
  border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;
  display:none;
}
@keyframes spin { to { transform:rotate(360deg) } }

/* Success overlay */
.success-overlay {
  position:fixed; inset:0; z-index:9999;
  background:rgba(16,185,129,0.1);
  backdrop-filter:blur(4px);
  display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:16px;
}
.success-overlay.show { display:flex; animation:fadeIn .3s ease; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.success-box {
  background:#fff; border-radius:24px; padding:36px 40px;
  text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.15);
  animation: popIn .4s cubic-bezier(.22,.68,0,1.3) both;
}
@keyframes popIn { from{opacity:0;transform:scale(.8)} to{opacity:1;transform:scale(1)} }
.success-icon { font-size:3.5em; margin-bottom:12px; }
.success-unit { font-size:1.5em; font-weight:800; color:var(--text); margin-bottom:8px; }
.success-text { font-size:0.88em; color:var(--text2); }

/* Dark mode */
html.dark {
  --bg:#0f1117; --surface:#1c2133; --border:#2a3352; --border-hover:#3a4a6e;
  --text:#e8edf8; --text2:#8a9abf; --text3:#4a5a7a;
  --shadow:0 2px 12px rgba(0,0,0,0.4);
}
#dm-btn {
  position:fixed; top:14px; right:18px; z-index:9999;
  width:46px; height:46px; border-radius:50%;
  background:var(--surface); border:1.5px solid var(--border);
  box-shadow:var(--shadow-hover); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; transition:transform .2s ease;
  user-select:none;
}
#dm-btn:hover { transform:scale(1.13) rotate(18deg); }

.footer {
  margin-top:24px; text-align:center; font-size:0.72em;
  color:var(--text3); position:relative; z-index:1;
}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <div class="brand-ring">
      <img src="logowing23.png" class="brand-img" alt="กองบิน ๒๓">
    </div>
    <h1>ระบบจำหน่ายบุคลากร</h1>
    <p class="brand-sub">บันทึกและติดตามการปฏิบัติงาน<br>ป้องกันการจำหน่ายวันซ้ำซ้อน</p>
    <div class="brand-pill">✦ กองบิน ๒๓</div>
  </div>

  <div class="card">
    <div class="card-title"><span>🔐</span> เข้าสู่ระบบ</div>

    <p class="card-desc">กรุณากรอกชื่อผู้ใช้และรหัสผ่านของท่าน</p>

    <form id="loginForm" onsubmit="doLogin(event)" autocomplete="on" novalidate>
      <div class="field">
        <label for="username">ชื่อผู้ใช้ (Username)</label>
        <div class="input-wrap">
          <input type="text" id="username" name="username" autocomplete="username"
                 autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="100">
        </div>
      </div>

      <div class="field">
        <label for="password">รหัสผ่าน (Password)</label>
        <div class="input-wrap has-eye">
          <input type="password" id="password" name="password" autocomplete="current-password" maxlength="100">
          <button type="button" class="eye-btn" id="eyeBtn" onclick="togglePw()" aria-label="แสดง/ซ่อนรหัสผ่าน">👁️</button>
        </div>
      </div>

      <div class="error-msg" id="errorMsg" role="alert"></div>

      <button type="submit" class="btn-login" id="btnLogin">
        <span id="btnText">เข้าสู่ระบบ</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </form>
  </div>
</div>

<div class="footer">ระบบจำหน่ายบุคลากร · กองบิน ๒๓</div>

<!-- Success Overlay -->
<div class="success-overlay" id="successOverlay">
  <div class="success-box">
    <div class="success-icon">✅</div>
    <div class="success-unit" id="successUnit"></div>
    <div class="success-text">เข้าสู่ระบบสำเร็จ กำลังเข้าสู่หน้าหลัก...</div>
  </div>
</div>

<button id="dm-btn" title="สลับ Dark/Light Mode">🌙</button>

<script>
// ── Dark mode ──
(function(){
  var html = document.documentElement;
  var btn  = document.getElementById('dm-btn');
  function applyTheme(dark){
    if(dark){ html.classList.add('dark'); btn.textContent='☀️'; }
    else     { html.classList.remove('dark'); btn.textContent='🌙'; }
  }
  var saved = localStorage.getItem('theme');
  applyTheme(saved === 'dark');
  btn.addEventListener('click', function(){
    var isDark = html.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
    applyTheme(!isDark);
  });
})();

// ── Sound Effects via Web Audio API ──
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

function playBeep(freq, dur, type='sine', vol=0.3){
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(e){}
}

function playKeyClick(){
  playBeep(800, 0.06, 'square', 0.15);
}

function playLoginSuccess(){
  // Happy ascending chime
  const notes = [523, 659, 784, 1047];
  notes.forEach((f,i) => setTimeout(()=>playBeep(f, 0.18, 'sine', 0.25), i*80));
}

function playLoginFail(){
  // Low buzzer
  playBeep(200, 0.12, 'sawtooth', 0.3);
  setTimeout(()=>playBeep(160, 0.2, 'sawtooth', 0.3), 140);
}

function playSaveSuccess(){
  playBeep(880, 0.1, 'sine', 0.2);
  setTimeout(()=>playBeep(1100, 0.15, 'sine', 0.2), 100);
}

function playSaveFail(){
  playBeep(220, 0.15, 'sawtooth', 0.25);
  setTimeout(()=>playBeep(180, 0.2, 'sawtooth', 0.25), 160);
}

// Expose save sounds globally so other pages can use
window.playSaveSuccess = playSaveSuccess;
window.playSaveFail = playSaveFail;

// ── Login (username + password — ตรวจกับชีต "login" ที่ฝั่ง GAS) ──
const elUser = document.getElementById('username');
const elPass = document.getElementById('password');

function togglePw(){
  const show = elPass.type === 'password';
  elPass.type = show ? 'text' : 'password';
  document.getElementById('eyeBtn').textContent = show ? '🙈' : '👁️';
}

function showError(msg){
  const el = document.getElementById('errorMsg');
  el.textContent = '⚠️ ' + msg;
  el.classList.add('show');
}
function clearError(){
  document.getElementById('errorMsg').classList.remove('show');
  elUser.classList.remove('error'); elPass.classList.remove('error');
}
function flagField(el){
  el.classList.add('error');
  setTimeout(() => el.classList.remove('error'), 600);
}
elUser.addEventListener('input', clearError);
elPass.addEventListener('input', clearError);

async function doLogin(ev){
  if(ev) ev.preventDefault();
  const username = elUser.value.trim();
  const password = elPass.value;

  if(!username || !password){
    if(!username) flagField(elUser);
    if(!password) flagField(elPass);
    showError('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
    playLoginFail();
    (!username ? elUser : elPass).focus();
    return;
  }

  const btn = document.getElementById('btnLogin');
  const btnText = document.getElementById('btnText');
  const spinner = document.getElementById('spinner');
  btn.disabled = true;
  btnText.textContent = 'กำลังตรวจสอบ...';
  spinner.style.display = 'block';

  try {
    // POST — รหัสผ่านอยู่ใน body ไม่ปรากฏใน URL / ประวัติเบราว์เซอร์
    const t0 = performance.now();
    const res = await fetch(GAS_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'login', username: username, password: password })
    });
    const data = await res.json();
    // เวลารวม (ms) เทียบกับเวลาที่ GAS ทำงานจริง — ส่วนต่าง = เครือข่าย/cold start (ดูได้ที่ DevTools → Console)
    console.log('[login] รวม ' + Math.round(performance.now() - t0) + ' ms | GAS ทำงาน ' + (data.ms != null ? data.ms : '?') + ' ms');

    if(data.success){
      // เคลียร์ค่าเก่าจากระบบเดิม (LINE / รหัสหน่วย) กันค้าง
      ['unitName','unitCode','lineUserId','line_pending_userId','line_pending_name','line_pending_picture']
        .forEach(k => sessionStorage.removeItem(k));
      sessionStorage.setItem('userName', data.name);
      sessionStorage.setItem('username', data.username || username);
      sessionStorage.setItem('loggedIn', '1');

      elUser.classList.add('success'); elPass.classList.add('success');
      playLoginSuccess();

      document.getElementById('successUnit').textContent = data.name;
      document.getElementById('successOverlay').classList.add('show');

      setTimeout(() => { window.location.href = 'index.html'; }, 600);
    } else {
      flagField(elUser); flagField(elPass);
      showError(data.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
      playLoginFail();
      elPass.value = '';
      elPass.focus();
    }
  } catch(err){
    showError('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
    playLoginFail();
  } finally {
    btn.disabled = false;
    btnText.textContent = 'เข้าสู่ระบบ';
    spinner.style.display = 'none';
  }
}

elUser.focus();

// อุ่นเครื่อง GAS ระหว่างที่ผู้ใช้พิมพ์ชื่อผู้ใช้/รหัสผ่าน — ลดอาการ "cold start" ครั้งแรกที่กดล็อกอินช้า
fetch(GAS_API_URL + '?action=ping').catch(function(){});
// โหลดรายชื่อแผนก (เล็กมาก) ไว้ล่วงหน้าระหว่างที่ผู้ใช้พิมพ์ — พอเข้าระบบแล้วเปิดเมนูไหนก็ได้แผนกทันที
if(window.DataCache) DataCache.getDeptList().catch(function(){});
</script>
<script>if(window.Loader)Loader.hide();</script>
</body>
</html>
